<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DARK CODE SYSTEM</title>
    <!-- favicon to avoid 404 -->
    <link rel="icon" href="/favicon.ico" />

    <!-- Tailwind CSS (build locally; remove CDN in production) -->
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <!-- Google Fonts: Cairo (UI) & JetBrains Mono (Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
    
    <style>
      body {
        background-color: #000;
        color: #e5e5e5;
        font-family: 'Cairo', sans-serif;
        overflow-x: hidden;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #020617; }
      ::-webkit-scrollbar-thumb { background: #1e3a8a; border-radius: 2px; }
      ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }

      .glass-panel {
        background: rgba(5, 5, 5, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
    </style>
    <!-- NOTE: original code used an importmap for aistudio environment. -->
    <!-- Remove it when running under Vite; dependencies are bundled locally. -->
  </head>
  <body class="bg-carbon bg-fixed min-h-screen selection:bg-primary/30 selection:text-primary">
    <div id="root"></div>
    <!-- CRT overlay removed for simpler design -->

    <!-- Vite entrypoint: load the React application -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
